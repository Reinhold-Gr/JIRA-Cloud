client: "{{rule.name}}"
export:
  view: "AS_acceptation-confirmation"
  viewContext: SINGLE_ISSUE_VIEW
  columnConfiguration: USER_DEFAULT
  jql: "key = {{issue.key}}"
  filename: "{{issue.key}}_Auftragsbestätigung.pdf"
actions:
  - name: Attach PDF to issue
    type: ATTACH
    toIssueKey: "{{issue.key}}"

  - name: Auftragsbestätigung per E-Mail senden
    type: SEND
    to: "{{issue.customfield_10400}}"
    subject: "AS - Auftragsbestätigung für Auftrag {{issue.customfield_10200}}"
    body: |
      <html><body>
      <p><strong>=====================<br>
      AktivSenioren Bayern e.V.<br>
      =====================</strong></p>
      <p>Sehr geehrte Damen und Herren,</p>
      <p>wir bedanken uns nochmals für Ihren Auftrag. Wir haben ihn zur Bearbeitung angenommen.</p>
      <p>Ihre Auftrags-Nummer lautet: <strong>{{issue.customfield_10200}}</strong>.</p>
      <p>Bitte geben Sie bei allen telefonischen oder schriftlichen Rückfragen diese Nummer an.</p>
      <p>Ihre Auftragsbestätigung finden Sie als Anlage (im PDF-Format), auch zum Ausdrucken für Ihre Unterlagen. Bitte überweisen Sie den Rechnungsbetrag erst, wenn Sie eine Rechnung erhalten haben. Diese wird Ihnen demnächst per Mail zugehen.</p>
      <p><strong>Falls noch nicht geschehen, wird sich in Kürze ein Kollege / eine Kollegin mit Ihnen in Verbindung setzen, um die nächsten Schritte zu vereinbaren. Sollten Sie bis dahin noch Fragen haben, können Sie {{issue.customfield_10306}} unter der E-Mailadresse  {{issue.customfield_10298}} erreichen.</p>
      <p><strong>Hinweis:</strong> Bitte antworten Sie nicht auf diese E-Mail. Die Adresse noreply@aktivsenioren.de dient ausschließlich zur automatischen Versendung von E-Mails.</p>
      <p>Wir freuen uns auf die Zusammenarbeit.</p>
      <p><strong>AktivSenioren Bayern e.V.</strong><br>
      Landshuter Allee 11; 80637 München; Tel.: 089 / 22 22 37; Fax: 089 / 22 99 68; info@aktivsenioren.de<br>
      Stadtsparkasse München IBAN: DE77 7015 0000 1003 4646 56 BIC/SWIFT: SSKMDEMMXXX<br>
      Amtsgericht München: VR: 11147; St. Nr.: 143/210/20578;</p>
      <hr>
      <p style="font-size:10px;">Der Inhalt dieser E-Mail einschließlich eventuell angehängter Dokumente ist vertraulich und ausschließlich für den bezeichneten Adressaten bestimmt. Wenn Sie nicht der vorgesehene Adressat dieser E-Mail oder dessen Vertreter sein sollten, so beachten Sie bitte, dass jede Form der Kenntnisnahme, Veröffentlichung, Vervielfältigung oder Weitergabe des Inhalts dieser E-Mail unzulässig ist.</p>
      </body></html>

  - name: Call back to Jira Cloud Automation
    type: CALL
    url: https://api-private.atlassian.com/automation/webhooks/jira/a/101e4b0b-81f1-417e-842e-7a47405e08f8/01a010ac-ae62-7f86-941c-19b06cad6c10
    secret: f55